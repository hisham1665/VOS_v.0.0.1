[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-v0"
version = "1.0.0"
description = "AOS core engine with an auditable paper-evaluation workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "requests>=2.31.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "groq>=0.13.0",
    "openai>=1.0.0",
    "ddgs>=9.0.0",
    "huggingface_hub[inference]>=0.35.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
aos = "aos_v0.cli:main"
aos-tui = "aos_v0.tui:main"
aos-registry-export = "aos_v0.services.registry_export:main"
aos-exam = "aos_v0.exam.cli:main"

[project.optional-dependencies]
tui = ["textual>=0.58,<2.0", "rich>=13,<15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
